<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCode</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/telaPrincipal.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>

    <header>
        <nav>
            <!-- data-abrir = id do modal que esse botão abre -->
            <section class="h-op" data-abrir="modal-residuo">
                <h4>Cadastrar Resíduo</h4>
            </section>

            <section class="h-op" data-abrir="modal-pessoa">
                <h4>Cadastrar Pessoa</h4>
            </section>
        </nav>

        <div>
            <h1>EcoCode</h1>
        </div>
    </header>

    <section class="container">

        <div class="ListaVazia">
            <p>Lista Vazia</p>
        </div>

        <section class="Adds">
            <div class="Filtros">
                <select name="Filtros" id="Filtros">
                    <option value="Filtros">Filtros</option>
                    <option value="PCs e Notebooks">Computadores e notebooks</option>
                    <option value="Celular tablet">Celulares e tablets</option>
                    <option value="Cabos periféricos">Cabos Periféricos</option>
                    <option value="Baterias Pilhas">Baterias e pilhas</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="Editar">E</div>
            <div class="Deletar">X</div>
        </section>

    </section>

    
    <div class="modal" id="modal-residuo">
        <div class="modal-conteudo">
            <button type="button" class="fechar" data-fechar>&times;</button>

            <form id="form-residuo">
                <h2>Cadastrar Resíduo</h2>

                <label for="tipo-residuo">Tipo de resíduo</label>
                <select id="tipo-residuo" name="tipo" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="PCs e Notebooks">Computadores e notebooks</option>
                    <option value="Celular tablet">Celulares e tablets</option>
                    <option value="Cabos periféricos">Cabos Periféricos</option>
                    <option value="Baterias Pilhas">Baterias e pilhas</option>
                    <option value="Outros">Outros</option>
                </select>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade" min="1" step="1" required>

                <label for="descricao">Descrição (opcional)</label>
                <textarea id="descricao" name="descricao" rows="3"></textarea>

                <input class="enviar" type="submit" value="Cadastrar">
            </form>
        </div>
    </div>

    
    <div class="modal" id="modal-pessoa">
        <div class="modal-conteudo">
            <button type="button" class="fechar" data-fechar>&times;</button>

            <form id="form-pessoa">
                <h2>Cadastrar Pessoa</h2>

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14"
                       placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>

                <label for="confirmar-senha">Confirme sua senha</label>
                <input type="password" id="confirmar-senha" name="confirmarSenha" required>

                <label for="cargo">Cargo</label>
                <select id="cargo" name="cargo" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="gerente">Gerente</option>
                    <option value="funcionario">Funcionário</option>
                </select>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <input class="enviar" type="submit" value="Cadastrar">
            </form>
        </div>
    </div>

    <script src="../js/tela.js"></script>
</body>
</html>
